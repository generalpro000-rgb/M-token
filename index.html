        .vault-box { border: 2px solid var(--neon-green); padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); text-align: center; background: #000; }

        .hidden { display: none; }
        .stats { display: flex; justify-content: space-around; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        #system-msg { font-size: 0.8rem; color: #888; margin-bottom: 20px; text-transform: uppercase; }

</head>

</div>
