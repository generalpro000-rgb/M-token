<div id="elite-game">
    <h3>عجلة النخبة اليومية</h3>
    <div id="wheel-container" style="width:200px; height:200px; border-radius:50%; border:5px solid #00ff41; margin:auto; display:flex; align-items:center; justify-content:center; font-size:1.5rem; transition: transform 3s ease-out;">
        <span id="wheel-value">؟</span>
    </div>
    <button onclick="spinWheel()" id="spin-btn">ابدأ المحاولة (مرة واحدة في اليوم)</button>
</div>

<script>
function spinWheel() {
    let btn = document.getElementById('spin-btn');
    let wheel = document.getElementById('wheel-container');
    let val = document.getElementById('wheel-value');
    
    btn.disabled = true; // منع اللعب مرة أخرى
    let randomSpin = Math.floor(Math.random() * 3600) + 720; // دوران عشوائي
    wheel.style.transform = `rotate(${randomSpin}deg)`;
    
    setTimeout(() => {
        let winPoints = [0, 100, 500, 1000, 50, 200][Math.floor(Math.random() * 6)];
        val.innerText = winPoints;
        alert("ربحت " + winPoints + " نقطة!");
        // هنا يجب إرسال النقاط لـ Firebase لكي لا تضيع عند تحديث الصفحة
    }, 3000);
}
</script>
