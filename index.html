<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER | THE VAULT</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { border: 2px solid var(--neon); padding: 25px; width: 380px; text-align: center; background: #000; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 20px auto; border: 4px solid var(--neon); border-radius: 50%; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .wheel-img { width: 100%; height: 100%; background: conic-gradient(#111 0deg 60deg, #222 60deg 120deg, #111 120deg 180deg, #222 180deg 240deg, #111 240deg 300deg, #222 300deg 360deg); display: flex; align-items: center; justify-content: center; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff3e3e; z-index: 10; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--neon); color: #fff; }
        button { background: var(--neon); color: #000; font-weight: bold; cursor: pointer; }
        button:disabled { background: #222; color: #555; border-color: #333; cursor: not-allowed; }
        .withdraw-btn { background: #ff3e3e; color: #fff; border: none; display: none; animation: pulse 1.5s infinite; }
        .hidden { display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <h1>MAHER</h1>
    <div id="status-bar" style="font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">
        رصيدك الحالي: <span id="total-pts-display">0</span> نقطة
    </div>

    <div id="step-pay">
        <p>أدخل كود 1 DT لتفعيل المحاولة</p>
        <input type="text" id="pay-code" placeholder="رقم عملية D17">
        <button onclick="requestAccess()">تفعيل العجلة</button>
    </div>

    <div id="step-wheel" class="hidden">
        <div class="pointer"></div>
        <div class="wheel-container" id="wheel-id">
            <div class="wheel-img"><span id="spin-val" style="font-size: 1.5rem;">READY</span></div>
        </div>
        <button onclick="startSpin()" id="spin-btn">إطلاق العجلة</button>
        <h3 id="result-msg"></h3>
        <button id="withdraw-btn" class="withdraw-btn" onclick="sendWithdrawRequest()">سحب الأرباح الآن (10 DT)</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // تحديث العرض عند تحميل الصفحة
    window.onload = function() {
        let savedPts = parseInt(localStorage.getItem('user_total_pts')) || 0;
        document.getElementById('total-pts-display').innerText = savedPts;
        
        checkWithdrawStatus(savedPts);

        const lastPlayed = localStorage.getItem('last_played_time');
        const now = new Date().getTime();
        if (lastPlayed && (now - lastPlayed < 24 * 60 * 60 * 1000)) {
            updateCountdown(24 * 60 * 60 * 1000 - (now - lastPlayed));
        }
    };

    function checkWithdrawStatus(points) {
        if (points >= 1000) {
            document.getElementById('withdraw-btn').style.display = 'block';
        }
    }

    function updateCountdown(duration) {
        const timer = setInterval(() => {
            const hours = Math.floor((duration / (3600000)) % 24);
            const minutes = Math.floor((duration / 60000) % 60);
            const seconds = Math.floor((duration / 1000) % 60);
            document.getElementById('game-box').innerHTML = `<h2>النظام مغلق</h2><p>عد بعد:</p><h1 style="color:var(--neon)">${hours}h ${minutes}m ${seconds}s</h1>`;
            duration -= 1000;
            if (duration < 0) { clearInterval(timer); localStorage.clear(); location.reload(); }
        }, 1000);
    }

    function requestAccess() {
        const code = document.getElementById('pay-code').value;
        if(code.length < 5) return alert("الكود قصير!");
        db.ref('active_requests').push({ code: code, time: new Date().toLocaleString() });
        document.getElementById('step-pay').classList.add('hidden');
        document.getElementById('step-wheel').classList.remove('hidden');
    }

    function startSpin() {
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        let deg = Math.floor(Math.random() * 3600) + 1000;
        document.getElementById('wheel-id').style.transform = `rotate(${deg}deg)`;

        setTimeout(() => {
            let ptsList = [10, 50, 100, 200, 500, 0];
            let won = ptsList[Math.floor(Math.random() * ptsList.length)];
            let currentTotal = (parseInt(localStorage.getItem('user_total_pts')) || 0) + won;
            
            localStorage.setItem('user_total_pts', currentTotal);
            localStorage.setItem('last_played_time', new Date().getTime());
            
            db.ref('winners_logs').push({ points: won, total: currentTotal, date: new Date().toLocaleString() });

            alert("ربحت " + won + " نقطة! مجموعك الآن: " + currentTotal);
            location.reload();
        }, 4100);
    }

    function sendWithdrawRequest() {
        let pts = localStorage.getItem('user_total_pts');
        let phone = prompt("أدخل رقم هاتفك لاستلام 10 DT:");
        if (phone) {
            db.ref('withdraw_requests').push({ phone: phone, points: pts, status: "pending" });
            alert("تم إرسال طلبك بنجاح! سيتم الاتصال بك خلال 24 ساعة.");
            localStorage.setItem('user_total_pts', 0); // تصفير النقاط بعد السحب
            location.reload();
        }
    }
</script>
</body>
</html>
