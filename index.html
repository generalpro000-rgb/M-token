<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER | ELITE WHEEL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { border: 2px solid var(--neon); padding: 25px; width: 380px; text-align: center; background: #000; box-shadow: 0 0 20px rgba(0,255,65,0.2); position: relative; }
        
        /* تصميم العجلة */
        .wheel-container { position: relative; width: 260px; height: 260px; margin: 20px auto; border: 4px solid var(--neon); border-radius: 50%; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .wheel-img { width: 100%; height: 100%; background: conic-gradient(#111 0deg 60deg, #222 60deg 120deg, #111 120deg 180deg, #222 180deg 240deg, #111 240deg 300deg, #222 300deg 360deg); display: flex; align-items: center; justify-content: center; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ff3e3e; z-index: 10; }

        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--neon); color: #fff; }
        button { background: var(--neon); color: #000; font-weight: bold; cursor: pointer; }
        button:disabled { background: #222; color: #555; border-color: #333; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="game-box">
    <h1>MAHER</h1>
    <div id="status" style="font-size: 0.7rem; color: #666;">STATUS: PROTECTED</div>

    <div id="step-pay">
        <p>أدخل كود 1 DT للتفعيل</p>
        <input type="text" id="pay-code" placeholder="رقم العملية">
        <button onclick="requestAccess()">تفعيل العجلة</button>
    </div>

    <div id="step-wheel" class="hidden">
        <div class="pointer"></div>
        <div class="wheel-container" id="wheel-id">
            <div class="wheel-img"><span id="spin-val">ELITE</span></div>
        </div>
        <button onclick="startSpin()" id="spin-btn">إطلاق العجلة</button>
        <h3 id="result-msg"></h3>
    </div>
</div>

<script>
    // الحماية من إعادة التحميل (Anti-Refresh)
    window.onload = function() {
        if (localStorage.getItem('maher_played') === 'true') {
            document.getElementById('game-box').innerHTML = '<h2 style="color:#ff3e3e;">تنبيه الأمان</h2><p>لقد استنفدت محاولتك اليومية. عد بعد 24 ساعة.</p>';
        }
    };

    const firebaseConfig = {
        databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function requestAccess() {
        const code = document.getElementById('pay-code').value;
        if(code.length < 5) return alert("الكود غير صالح");
        
        // إرسال الكود لـ Firebase
        db.ref('active_requests').push({ code: code, status: "pending" });
        
        // لمحاكاة السرعة في التجربة سيفتح الآن مباشرة، وفي الحقيقة سنفعل "الموافقة" لاحقاً
        document.getElementById('step-pay').classList.add('hidden');
        document.getElementById('step-wheel').classList.remove('hidden');
    }

    function startSpin() {
        const btn = document.getElementById('spin-btn');
        const wheel = document.getElementById('wheel-id');
        
        btn.disabled = true; // منع الضغط المتكرر أثناء الدوران

        let deg = Math.floor(Math.random() * 3600) + 1000;
        wheel.style.transform = `rotate(${deg}deg)`;

        setTimeout(() => {
            let pts = [10, 20, 50, 100, 200, 0][Math.floor(Math.random() * 6)];
            document.getElementById('spin-val').innerText = pts + " PTS";
            document.getElementById('result-msg').innerText = "مبروك! ربحت " + pts + " نقطة";
            
            // قفل الحماية: تخزين أن المستخدم لعب بالفعل
            localStorage.setItem('maher_played', 'true');
            
            // تسجيل النتيجة في Firebase لتعرف أنت كم ربح
            db.ref('winners').push({ points: pts, time: new Date().toLocaleString() });
            
            alert("تم حفظ محاولتك. النظام مغلق الآن.");
        }, 4100);
    }
</script>
</body>
</html>
